name: Chrome Web Store Status Check

# 毎日 1 回 Chrome Web Store API v2 の status (fetchStatus) を確認し、
# 審査却下 (REJECTED) や停止状態 (SUSPENDED / TAKEN_DOWN 等) を検出したときに
# GitHub Issue を起票 (既存のオープン Issue があればコメント追記) する。
# vars.CWS_ENABLED が 'true' のときだけ動作する。

on:
  schedule:
    - cron: '17 21 * * *' # 毎日 06:17 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cws-status
  cancel-in-progress: false

jobs:
  check-status:
    if: vars.CWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Authenticate to Google (Workload Identity Federation)
        id: gauth
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          access_token_lifetime: 900s

      - name: Fetch Chrome Web Store status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          node scripts/cws-publish.mjs status > "$RUNNER_TEMP/cws-status.json"

      - name: Evaluate status and notify via Issue if rejected or suspended
        env:
          GH_TOKEN: ${{ github.token }}
          CWS_ENABLED: ${{ vars.CWS_ENABLED }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "cws-status" --json number --jq '.[0].number // empty' || true)
          eval_out="$RUNNER_TEMP/cws-eval.env"
          body_file="$RUNNER_TEMP/cws-issue-body.md"
          GITHUB_OUTPUT="$eval_out" node scripts/release/cws-status.mjs \
            --status-file "$RUNNER_TEMP/cws-status.json" \
            --existing-issue "$existing" \
            --out-body "$body_file" \
            --run-url "$WORKFLOW_RUN_URL"

          should_create=$(grep '^should_create_issue=' "$eval_out" | cut -d= -f2-)
          should_comment=$(grep '^should_comment_issue=' "$eval_out" | cut -d= -f2-)
          issue_title=$(grep '^issue_title=' "$eval_out" | cut -d= -f2-)

          if [ "$should_create" = "true" ]; then
            gh label create "cws-status" --repo "$GITHUB_REPOSITORY" --color "d93f0b" --description "Chrome Web Store status alert" --force >/dev/null 2>&1 || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$issue_title" \
              --label "cws-status" \
              --body-file "$body_file"
          elif [ "$should_comment" = "true" ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          fi
