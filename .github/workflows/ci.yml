name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 既定は読み取り専用 (最小権限)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, LinkCheck, Test, Advisory & Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Advisory Database
        run: npm run advisories:validate

      - name: Advisory DB reproducibility (snapshot -> advisory-db.json)
        # upstream スナップショットが存在する場合、コミット済みDBが手編集されていないことを検証する
        run: |
          if [ -f data/advisories/upstream/manifest.json ]; then
            node scripts/advisories/build-db.mjs --check
          else
            echo "upstream スナップショット未作成のためスキップ (初回の Advisory DB Update 実行後に有効化されます)"
          fi

      - name: Verify curated advisories against NVD snapshot
        run: npm run advisories:verify-nvd

      - name: Run Test Suite (Typecheck, Link Check, Vitest)
        run: npm test

      - name: Build Extension (Vite)
        run: npm run build

      - name: Check for forbidden paths and environment traces (CI-01 Guard)
        run: |
          echo "Checking for sensitive author environment paths or tools..."
          if git grep -nI -E "/User[s]/[^/]+/" -- . ':!package-lock.json' ':!.github/workflows/ci.yml' || \
             git grep -nI -i -e "kopak[a]s" -e "antigravit[y]" -e "Desktop/Developmen[t]" -- . ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "::error::Sensitive author environment paths or tools detected in repository!"
            exit 1
          fi
          echo "Pass: No forbidden paths detected."
